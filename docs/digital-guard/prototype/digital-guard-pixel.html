  --f-mono:"GalmuriMono",ui-monospace,"D2Coding",Consolas,monospace;
  --u:3px; --scale:1;
  --num:#F7D84A; --accent:#45C7C1; --cond:#1A2340; --cond-t:#F2EBD9; --me:#2A3560;
  --sky:#151C33; --star:#F2EBD9; --moon:#F2EBD9; --bld:#1F2A4A; --lit:#F7D84A; --frame:#3A4E7A;
}
body.mood-light{--night:#E4EAF5;--night-2:#F7F4EC;--panel:#FFFFFF;--steel:#9DB0D3;--haze:#5A6D96;--white:#1C2440;--muted:#4C5A7C;
  --num:#8A5A00;--accent:#1D7570;--cond:#FFF6CF;--cond-t:#22201F;--me:#FFF3C4;
  --sky:#9ED3F0;--star:#9ED3F0;--moon:#FFF3B0;--bld:#7A99C9;--lit:#E8F2FC;--frame:#F7F4EC}
*{box-sizing:border-box}
html,body{height:100%}
html{font-size:calc(16px * var(--scale))}
body{margin:0;background:var(--night);color:var(--white);font-family:var(--f-body);line-height:1.55;overflow:hidden;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0;
  -webkit-font-smoothing:none;font-smooth:never}
body.plain-font{--f-body:var(--f-plain);-webkit-font-smoothing:auto}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit;touch-action:manipulation}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
button:disabled{cursor:not-allowed}
svg.px{display:inline-block;vertical-align:-0.15em;shape-rendering:crispEdges;flex-shrink:0}

/* pixel border: notched corners drawn with four hard shadows */
.pxb{box-shadow:0 calc(-1*var(--u)) 0 0 var(--bc,var(--steel)),0 var(--u) 0 0 var(--bc,var(--steel)),calc(-1*var(--u)) 0 0 0 var(--bc,var(--steel)),var(--u) 0 0 0 var(--bc,var(--steel))}

.stage{height:100%;display:flex;justify-content:center;gap:36px;padding-block:14px;background-image:radial-gradient(var(--night-2) 2px,transparent 2px);background-size:12px 12px}
.device{position:relative;width:100%;max-width:430px;height:100%;display:flex;flex-direction:column;background:var(--night-2);--bc:var(--steel);min-height:0;margin-inline:var(--u)}

/* top bar */
.topbar{flex-shrink:0;display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--panel);border-bottom:var(--u) solid var(--steel)}
.lamps{display:flex;gap:5px}
.lamps i{width:9px;height:9px;display:block}
.lamps i:nth-child(1){background:var(--red)}.lamps i:nth-child(2){background:var(--green)}.lamps i:nth-child(3){background:var(--yellow)}
.topbar .where{flex:1;min-width:0;font-size:0.8125rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .where b{color:var(--white);font-weight:700;font-family:var(--f-head);font-size:0.9375rem;margin-right:6px}
.icon-btn{min-width:44px;min-height:40px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 8px;color:var(--muted);font-size:0.8125rem}
.icon-btn:hover{color:var(--white)}

.condition{flex-shrink:0;display:flex;gap:8px;align-items:center;width:100%;padding:8px 12px;background:var(--cond);border-bottom:2px dashed var(--steel);color:var(--yellow);font-size:0.8125rem;text-align:left}
.condition span{flex:1;min-width:0;color:var(--cond-t)}
.condition b{font-weight:700;color:var(--num);white-space:nowrap}

.screen{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:14px 14px 18px;scrollbar-width:thin;scrollbar-color:var(--steel) transparent}
.dock{flex-shrink:0;background:var(--panel);border-top:var(--u) solid var(--steel);padding:8px 10px 10px}

/* title */
.title{display:flex;flex-direction:column;gap:18px;min-height:100%;justify-content:center;padding-block:10px}
.logo{font-family:var(--f-head);font-size:3.4rem;line-height:1;letter-spacing:1px;color:var(--white);text-shadow:var(--u) var(--u) 0 var(--steel);margin:0}
.logo span{color:var(--accent)}
.subtitle{font-family:var(--f-head);color:var(--num);font-size:1.0625rem;margin:-6px 0 0}
.hero-scene{display:flex;align-items:flex-end;gap:12px;padding:14px;background:var(--night);--bc:var(--steel)}
.hero-scene .bubble{flex:1;background:var(--paper);color:var(--ink);padding:10px 12px;--bc:var(--ink);font-size:0.875rem}
.card{background:var(--panel);padding:12px 14px;--bc:var(--steel)}
.card h3{margin:0 0 6px;font-family:var(--f-head);font-weight:400;font-size:1rem;color:var(--accent)}
.nick{display:flex;align-items:center;justify-content:space-between;gap:10px}
.nick b{font-size:1.0625rem;color:var(--white)}
.small{font-size:0.8125rem;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:10px 16px;font-family:var(--f-head);font-size:1.0625rem;color:var(--ink);background:var(--bf,var(--teal));
  box-shadow:0 calc(-1*var(--u)) 0 0 var(--ink),calc(-1*var(--u)) 0 0 0 var(--ink),var(--u) 0 0 0 var(--ink),0 var(--u) 0 0 var(--bs,#2A8C88),0 calc(2*var(--u)) 0 0 var(--ink);
  margin-bottom:calc(2*var(--u));transition:transform .06s}
.btn:active:not(:disabled){transform:translateY(var(--u));box-shadow:0 calc(-1*var(--u)) 0 0 var(--ink),calc(-1*var(--u)) 0 0 0 var(--ink),var(--u) 0 0 0 var(--ink),0 var(--u) 0 0 var(--ink)}
.btn.full{width:100%}
.btn.ghost{--bf:var(--panel);--bs:var(--night);color:var(--white)}
.btn.yellow{--bf:var(--yellow);--bs:var(--yellow-d)}
.btn.green{--bf:var(--green);--bs:var(--green-d)}
.btn.red{--bf:var(--red);--bs:var(--red-d)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > *{flex:1;min-width:0}
.footnote{font-size:0.75rem;color:var(--haze);text-align:center;margin:0}

/* briefing */
.brief-day{font-family:var(--f-head);color:var(--muted);font-size:0.875rem;letter-spacing:2px}
.brief-day b{display:block;font-size:3.2rem;line-height:1.05;color:var(--num);letter-spacing:0;font-weight:400}
.news{display:flex;gap:10px;align-items:flex-start}
.rulecard{background:var(--paper);color:var(--ink);padding:14px;--bc:var(--ink);position:relative}
.rulecard .tag{display:inline-block;background:var(--ink);color:var(--paper);font-size:0.75rem;padding:1px 6px;margin-bottom:8px}
.rulecard h3{margin:0 0 10px;font-family:var(--f-head);font-weight:400;font-size:1.125rem;line-height:1.4;text-wrap:balance}
.example{display:grid;grid-template-columns:auto 1fr;gap:6px 8px;font-size:0.875rem;align-items:start}
.example .ok{color:var(--green-d);font-weight:700}.example .no{color:var(--red-d);font-weight:700}
.term{border-top:2px dashed var(--paper-2);margin-top:10px;padding-top:8px;font-size:0.8125rem;color:var(--pencil)}

/* desk */
.request{display:flex;gap:10px;align-items:flex-start;background:var(--panel);padding:10px 12px;--bc:var(--steel);margin-bottom:14px}
.request .who{font-size:0.75rem;color:var(--teal)}
.request p{margin:2px 0 0;font-size:0.9375rem}
.avatar{width:36px;height:36px;flex-shrink:0;background:var(--night)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:var(--u) var(--u) 8px;margin:0 calc(-1*var(--u))}
.tab{flex-shrink:0;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:6px 10px;font-size:0.8125rem;background:var(--night);color:var(--muted);--bc:var(--steel);position:relative}
.tab[aria-selected="true"]{background:var(--wood-2);color:var(--paper);--bc:var(--ink)}
.tab .new{width:7px;height:7px;background:var(--yellow);display:inline-block}
.doc{background:var(--paper);color:var(--ink);--bc:var(--ink);margin-top:2px}
.doc-head{display:flex;align-items:center;gap:8px;background:var(--wood);color:var(--paper);padding:6px 12px;font-size:0.875rem;border-bottom:var(--u) solid var(--wood-2)}
.doc-head .kind{margin-left:auto;font-size:0.75rem;opacity:.85}
.fields{display:flex;flex-direction:column}
.field{display:block;width:100%;padding:9px 12px;border-bottom:2px dashed var(--paper-2);position:relative;color:var(--ink)}
.field:last-child{border-bottom:0}
.field .lbl{display:flex;align-items:center;gap:6px;font-size:0.75rem;color:var(--pencil)}
.field .val{display:block;font-size:0.9375rem;white-space:pre-line;overflow-wrap:anywhere;margin-top:1px}
.field .val.mono{font-family:var(--f-mono);white-space:pre-wrap;font-size:0.875rem}
.field .marks{margin-left:auto;display:flex;gap:4px}
.mk{font-size:0.6875rem;padding:0 5px;line-height:1.5;font-family:var(--f-body)}
.mk.ok{background:var(--green);color:var(--ink)}.mk.bad{background:var(--yellow);color:var(--ink)}.mk.flag{background:var(--red);color:var(--white)}.mk.risk{background:var(--ink);color:var(--yellow)}
.field.sel{background:var(--hl);outline:var(--u) solid var(--ink);outline-offset:calc(-1*var(--u))}
.field.flagged{background:#F6D9CF}
.field.risk-show{background:#F6D9CF;outline:var(--u) dashed var(--red-d);outline-offset:calc(-1*var(--u))}
.mode-on .field:not(:disabled){cursor:crosshair}
.field .open-file{display:inline-flex;margin-top:6px;font-size:0.75rem;background:var(--ink);color:var(--paper);padding:2px 8px}
.tray{margin-top:16px}
.tray h4{margin:0 0 6px;font-size:0.75rem;color:var(--haze);font-weight:400;letter-spacing:1px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;font-size:0.75rem;line-height:1.45;color:var(--ink);background:var(--paper)}
.chip.ok{background:var(--green)}.chip.bad{background:var(--yellow)}.chip.flag{background:var(--red);color:var(--white)}
.chip .x{margin-left:2px;opacity:.7}
.empty-note{font-size:0.75rem;color:var(--haze)}
.modebar{display:flex;align-items:center;gap:8px;background:var(--yellow);color:var(--ink);padding:6px 10px;font-size:0.8125rem;margin-bottom:8px}
.modebar button{margin-left:auto;background:var(--ink);color:var(--yellow);padding:2px 8px;font-size:0.75rem;min-height:28px}

.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.tool{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:48px;padding:5px 2px;font-size:0.75rem;color:var(--muted);background:var(--night);--bc:var(--steel)}
.tool[aria-pressed="true"]{background:var(--yellow);color:var(--ink);--bc:var(--ink)}
.verdicts{display:flex;gap:9px}
.verdicts .btn{flex:1;min-width:0;flex-direction:column;gap:2px;min-height:64px;padding:6px 4px;font-size:1rem}
.verdicts .btn small{font-size:0.6875rem;font-family:var(--f-body)}

/* sheet */
.veil{position:absolute;inset:0;background:rgba(10,13,26,.78);display:flex;align-items:flex-end;z-index:20}
.sheet{width:100%;max-height:88%;overflow-y:auto;background:var(--paper);color:var(--ink);padding:16px 16px 18px;border-top:calc(2*var(--u)) solid var(--ink)}
.sheet h3{margin:0 0 6px;font-family:var(--f-head);font-weight:400;font-size:1.125rem;text-wrap:balance}
.sheet p{margin:0 0 10px;font-size:0.9375rem}
.sheet .btn.ghost{--bf:var(--paper-2);--bs:var(--pencil);color:var(--ink)}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;padding:10px;margin-bottom:8px;background:var(--white);--bc:var(--ink);font-size:0.9375rem}
.opt .box{width:18px;height:18px;flex-shrink:0;margin-top:2px;border:var(--u) solid var(--ink);background:var(--white);display:flex;align-items:center;justify-content:center}
.opt[aria-checked="true"]{background:var(--hl)}
.opt[aria-checked="true"] .box{background:var(--ink)}
.opt.round .box{border-radius:0}
.sheet .section{font-size:0.75rem;color:var(--pencil);margin:12px 0 6px;letter-spacing:1px}
.dot-line{display:flex;gap:10px;align-items:flex-start;background:var(--white);padding:10px;--bc:var(--ink);margin-bottom:12px}
.result-card{background:var(--white);padding:12px;--bc:var(--ink);margin-bottom:12px;font-size:0.9375rem}

/* result */
.seal{min-width:92px;width:max-content;padding:0 12px;white-space:nowrap;text-align:center;line-height:1.2;height:92px;margin:6px auto 10px;display:flex;align-items:center;justify-content:center;font-family:var(--f-head);font-size:1.375rem;border:calc(2*var(--u)) solid currentColor;transform:rotate(-8deg);animation:stamp .25s steps(3) both}
.seal.ok{color:var(--green)}.seal.retry{color:var(--yellow)}
@keyframes stamp{from{transform:scale(1.6) rotate(-8deg);opacity:0}to{transform:scale(1) rotate(-8deg);opacity:1}}
.res-title{text-align:center;font-family:var(--f-head);font-size:1.375rem;margin:0}
.res-sub{text-align:center;color:var(--muted);font-size:0.875rem;margin:4px 0 14px}
.score-list{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:0.875rem;font-variant-numeric:tabular-nums}
.score-list .total{border-top:2px dashed var(--steel);padding-top:6px;font-family:var(--f-head);color:var(--yellow)}
.explain{background:var(--paper);color:var(--ink);padding:14px;--bc:var(--ink)}
.explain h4{margin:0 0 6px;font-size:0.8125rem;color:var(--pencil);font-weight:400}
.explain p{margin:0 0 10px;font-size:0.9375rem}
.explain .tip{background:var(--hl);padding:8px 10px;margin:0}
.risk-list{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
.epi{display:flex;gap:10px;align-items:flex-start}
.epi .say{flex:1;background:var(--panel);padding:10px 12px;--bc:var(--steel);font-size:0.875rem}

/* report */
.stars{display:flex;justify-content:center;gap:8px;margin:4px 0 10px}
.metrics{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:0.9375rem;font-variant-numeric:tabular-nums}
.metrics span:nth-child(even){color:var(--num);text-align:right}
.gauge{display:grid;gap:4px;margin-top:6px}
.gauge .bar{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.gauge .bar i{height:12px;background:var(--night)}
.gauge .bar i.on{background:var(--teal)}
.gauge.conv .bar i.on{background:var(--green)}
.gauge .g-l{display:flex;justify-content:space-between;font-size:0.8125rem;color:var(--muted)}

.toast{position:absolute;left:12px;right:12px;bottom:178px;z-index:30;background:var(--ink);color:var(--paper);padding:8px 12px;font-size:0.875rem;--bc:var(--paper);pointer-events:none;animation:pop .2s steps(2) both}
@keyframes pop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.mock-tag{display:inline-block;background:var(--yellow);color:var(--ink);font-size:0.6875rem;padding:1px 6px}

.officer{display:inline-flex;flex-shrink:0;background:var(--panel);padding:4px;--bc:var(--steel)}
.officer.sm{padding:2px}
.hero-scene .bubble .by{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:0.75rem;color:var(--pencil)}
.sheet{position:relative}
.sheet-x{position:absolute;top:10px;right:12px;min-width:40px;min-height:40px;font-size:1rem;color:var(--ink)}
.seal.neutral{color:var(--ink)}
.seal.fail{color:var(--red);font-size:1.25rem}
.rv-h{margin:6px 0 4px;font-family:var(--f-head);font-weight:400;font-size:1rem;color:var(--accent)}
.review{background:var(--panel);--bc:var(--steel)}
.review.bad{--bc:var(--red)}
.rv-head{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;text-align:left}
.rv-t{flex:1;min-width:0;font-size:0.9375rem}
.rv-t small{display:block;font-size:0.75rem;color:var(--muted)}
.rv-t b{color:var(--white)}
.review .explain{margin:0 var(--u) var(--u)}
body.no-motion *,body.no-motion *::before{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.slogan{font-size:0.875rem;color:var(--muted);margin:2px 0 0;letter-spacing:1px}
.stamps{display:flex;gap:8px}
.stamps span{flex:1;text-align:center;padding:6px 2px;font-family:var(--f-head);font-size:0.875rem;border:var(--u) solid currentColor;transform:rotate(-4deg)}
.stamps .s1{color:var(--green)}.stamps .s2{color:var(--red);transform:rotate(3deg)}.stamps .s3{color:var(--yellow)}
@media (max-width:420px){.logo{font-size:2.8rem}.screen{padding:12px 10px 16px}}

/* v0.4: main menu, difficulty, ranking, HUD, booth scene */
.mainbar{display:flex;justify-content:space-between;align-items:center}
.hud-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:40px;min-height:40px;padding:0 10px;background:var(--night);color:var(--white);--bc:var(--steel);font-size:0.8125rem;margin:var(--u)}
.hud-btn[aria-pressed="false"]{color:var(--haze)}
.topbar .hud-btn{min-width:36px;min-height:34px;padding:0 8px;margin:0 2px}
.timer{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;background:var(--night);color:var(--num);--bc:var(--steel);font-size:0.8125rem;margin-right:var(--u)}
.timer b{font-family:var(--f-head);font-size:1rem;min-width:2ch;text-align:right;font-weight:400}
.timer.low{color:var(--red);--bc:var(--red)}
.mode-btn{justify-content:flex-start;gap:14px;text-align:left;min-height:64px}
.mode-btn span{display:flex;flex-direction:column;line-height:1.25}
.mode-btn small{font-family:var(--f-body);font-size:0.75rem;opacity:.85}
.navrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mode-tag{font-size:0.75rem;padding:2px 8px;background:var(--teal);color:var(--ink)}
.mode-tag.versus{background:var(--yellow)}
.scr-h{margin:0;font-family:var(--f-head);font-weight:400;font-size:1.5rem;display:flex;align-items:center;gap:8px}
.diff{display:flex;flex-direction:column;gap:4px;width:100%;padding:14px 16px 14px 22px;background:var(--panel);--bc:var(--steel);text-align:left;position:relative}
.diff::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--lvc)}
.lv0{--lvc:var(--green)}.lv1{--lvc:var(--teal)}.lv2{--lvc:var(--yellow)}.lv3{--lvc:var(--red)}
.diff-n{font-family:var(--f-head);font-size:1.375rem;color:var(--white)}
.diff-d{font-size:0.875rem;color:var(--muted)}
.diff-m{font-size:0.75rem;color:var(--haze)}
.diff.locked{opacity:.6}
.lock{position:absolute;top:12px;right:12px;display:inline-flex;gap:4px;align-items:center;font-size:0.6875rem;padding:1px 6px;background:var(--night);color:var(--muted)}
.lock.ok{background:var(--yellow);color:var(--ink)}
.rank-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.rk{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--panel);--bc:var(--steel)}
.rk.me{--bc:var(--yellow);background:var(--me)}
.rk-n{font-family:var(--f-head);font-size:1.25rem;width:1.6em;text-align:center;color:var(--num)}
.rk-who{flex:1;min-width:0;font-size:0.9375rem}
.rk-who small{display:block;font-size:0.75rem;color:var(--muted)}
.rk b{font-family:var(--f-head);font-weight:400;font-size:1.125rem}
.rank-card{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--yellow);color:var(--ink);--bc:var(--ink)}
.rank-card b{display:block;font-family:var(--f-head);font-weight:400;font-size:1.5rem;line-height:1.2}
.rank-card span{font-size:0.8125rem}
.scene{position:relative;display:flex;align-items:flex-end;gap:8px;min-height:150px;padding:12px 10px 0;margin-bottom:14px;overflow:hidden;background:var(--sky);--bc:var(--steel)}
.scene-svg{position:absolute;inset:0;width:100%;height:100%}
.scene .sk{fill:var(--sky)}.scene .st{fill:var(--star)}.scene .mn{fill:var(--moon)}.scene .bd{fill:var(--bld)}.scene .lt{fill:var(--lit)}.scene .fr{fill:var(--frame)}
.scene .counter{position:absolute;left:0;right:0;bottom:0;height:18px;background:var(--wood);border-top:var(--u) solid var(--wood-2);z-index:1}
.visitor{position:relative;flex-shrink:0;line-height:0}
.speech{position:relative;z-index:2;flex:1;align-self:flex-start;background:var(--paper);color:var(--ink);padding:9px 11px;--bc:var(--ink);font-size:0.875rem;margin:0 var(--u) 26px 8px}
.speech .who{font-size:0.75rem;color:var(--pencil)}

function px(name,size,color){
  const g=ICONS[name]; if(!g) return '';
  const w=Math.max(...g.map(r=>r.length)), h=g.length; let rects='';
  g.forEach((row,y)=>{let x=0;while(x<row.length){if(row[x]==='X'){let s=x;while(row[x]==='X')x++;rects+=`<rect x="${s}" y="${y}" width="${x-s}" height="1"/>`;}else x++;}});
  const s=size||16;
  return `<svg class="px" aria-hidden="true" width="${Math.round(s*w/Math.max(w,h))}" height="${Math.round(s*h/Math.max(w,h))}" viewBox="0 0 ${w} ${h}" fill="${color||'currentColor'}">${rects}</svg>`;
}

function sprite(rows,pal,size){
  const w=rows[0].length,h=rows.length;let r='';
  rows.forEach((row,y)=>[...row].forEach((c,x)=>{if(pal[c])r+=`<rect x="${x}" y="${y}" width="1" height="1" fill="${pal[c]}"/>`;}));
  return `<svg class="px" aria-hidden="true" width="${size}" height="${Math.round(size*h/w)}" viewBox="0 0 ${w} ${h}">${r}</svg>`;
}

/* ================= sound (tiny square-wave blips; only after a tap) ================= */
let AC=null;
function blip(kind){
  if(!S.settings.sound)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  const T={tap:[[660,.05]],stamp:[[140,.12],[90,.1]],tick:[[880,.04]],alarm:[[220,.15],[180,.15],[150,.2]],done:[[523,.08],[659,.08],[784,.14]]}[kind]||[[440,.05]];
  let t=AC.currentTime;
  T.forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=f;g.gain.setValueAtTime(.05,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d);t+=d;});
}

function allDocs(){return kase().docs.concat(S.c.extraDocs||[]);}
function docList(){return allDocs().filter(d=>!d.hidden||S.c.revealed.includes(d.id));}
function fieldIn(caseObj,extra,fid){const [d,f]=fid.split('.');const doc=caseObj.docs.concat(extra||[]).find(x=>x.id===d);return doc&&doc.fields.find(x=>x.id===f);}
function fieldBy(fid){return fieldIn(kase(),S.c.extraDocs,fid);}
function toMin(t){const [h,m]=t.split(':').map(Number);return h*60+m;}
function same(a,b){
  if(a&&a.range)return typeof b==='string'&&toMin(b)>=toMin(a.range[0])&&toMin(b)<=toMin(a.range[1]);
  if(b&&b.range)return same(b,a);
  if(Array.isArray(b))return b.includes(a); if(Array.isArray(a))return a.includes(b);
  return a===b;
}
function newCaseState(){return {si:0,flags:[],clues:[],revealed:[],extraDocs:[],stageLog:[],seen:[],altPath:false,left:versus()?D().time:null};}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function toast(msg){UI.toast=msg;renderToast();clearTimeout(toast.t);toast.t=setTimeout(()=>{UI.toast=null;renderToast();},2400);}
function renderToast(){const old=$('.toast');if(old)old.remove();if(UI.toast){const d=document.createElement('div');d.className='toast pxb';d.setAttribute('role','status');d.textContent=UI.toast;$('#device').appendChild(d);}}
function applySettings(){const st=S.settings;document.documentElement.style.setProperty('--scale',st.scale);document.body.classList.toggle('plain-font',!!st.plain);document.body.classList.toggle('no-motion',!!st.still);document.body.classList.toggle('mood-light',st.mood==='light');document.documentElement.style.colorScheme=st.mood==='light'?'light':'dark';}
function markSeen(id){if(!S.c.seen.includes(id))S.c.seen.push(id);}
const soundBtn=()=>`<button class="hud-btn pxb" data-act="sound" aria-label="소리 ${S.settings.sound?'끄기':'켜기'}" aria-pressed="${!!S.settings.sound}">${px(S.settings.sound?'sound':'mute',16)}</button>`;

/* ================= versus timer ================= */
let TICK=null;
function syncTimer(){
  const run=S.view==='desk'&&versus()&&S.c&&!(UI.sheet&&['pause','settings','processed'].includes(UI.sheet.type));
  if(run&&!TICK)TICK=setInterval(tick,1000);
  if(!run&&TICK){clearInterval(TICK);TICK=null;}
}
function tick(){
  if(!S.c||S.c.left==null)return;
  S.c.left=Math.max(0,S.c.left-1);
  const el=$('#timer');if(el){el.querySelector('b').textContent=S.c.left;el.classList.toggle('low',S.c.left<=10);}
  if(S.c.left<=5&&S.c.left>0)blip('tick');
  if(S.c.left===0){blip('alarm');UI.sheet=null;UI.mode=null;decide('timeout',[],null,null);}
}

/* ================= game logic ================= */
function tapField(fid){
  const f=fieldBy(fid);
  if(UI.mode==='flag'){const i=S.c.flags.indexOf(fid);if(i>=0)S.c.flags.splice(i,1);else S.c.flags.push(fid);blip('tap');save();render();return;}
  if(UI.mode==='compare'){
    if(!UI.pick){UI.pick=fid;blip('tap');render();return;}
    if(UI.pick===fid){UI.pick=null;render();return;}
    const a=fieldBy(UI.pick),b=f;
    if(!a.ck||!b.ck||a.ck!==b.ck){toast('비교할 수 없는 정보');UI.pick=null;render();return;}
    const pair=[UI.pick,fid].sort().join();
    if(!S.c.clues.some(c=>[c.a,c.b].sort().join()===pair)){const ok=same(a.cv,b.cv);S.c.clues.push({a:UI.pick,b:fid,ok});blip('tap');toast(ok?'일치':'불일치');}
    else toast('이미 비교함');
    UI.pick=null;save();render();return;
  }
  if(f.file){S.c.revealed.includes(f.file)||S.c.revealed.push(f.file);UI.tab=f.file;markSeen(f.file);save();render();}
}
function onVerdict(v){
  UI.mode=null;UI.pick=null;const st=stage();
  const needSheet=v==='reject'||(v==='verify'&&st.routes)||(st.reasons&&v!=='approve');
  if(!needSheet){decide(v,[],null,null);return;}
  UI.sheet={type:'decide',v,rs:[],route:null,report:null,order:st.reasons?shuffle(st.reasons.map((_,i)=>i)):[],rorder:st.routes?shuffle(st.routes.map((_,i)=>i)):[]};render();
}
// Grade silently. The player only learns the answer at the end of the run (or on a security incident).
function decide(v,rs,route,report){
  const k=kase(), st=stage(), c=S.c;
  const outcome=v===st.correct?'correct':(st.alt&&st.alt[v]?'alt':'wrong');
  const routeOk=v==='verify'&&st.routes&&route!=null?!!st.routes[route].ok:null;
  const docsNow=c.extraDocs.map(d=>d.id);
  const risk=st.risk.filter(r=>{const d=r.f.split('.')[0];return k.docs.some(x=>x.id===d)||docsNow.includes(d);});
  c.stageLog.push({si:c.si,verdict:v,correct:st.correct,outcome,flags:c.flags.slice(),clues:c.clues.map(x=>({a:x.a,b:x.b})),rs:rs.slice(),route,routeOk,report,reportable:st.reportable,risk,altPath:c.altPath,caseRisk:k.risk,left:c.left});
  UI.sheet=null; blip(v==='timeout'?'alarm':'stamp');
  // security incident: approving a dangerous high-risk request ends the run at once
  if(v==='approve'&&st.correct!=='approve'&&k.risk==='high'){finishCase();endDay('incident');return;}
  if(v==='verify'&&st.next){
    const docs=(routeOk?st.next.docs:(st.next.altDocs||st.next.docs)).map(d=>Object.assign({fresh:1},d));
    c.altPath=!routeOk; c.extraDocs=c.extraDocs.concat(docs); c.si++; c.flags=[];
    UI.tab=docs[0].id; markSeen(UI.tab); save(); render(); toast('확인 결과 도착'); return;
  }
  finishCase();
  if(S.ri+1<S.run.length){S.ri++;S.ci=S.run[S.ri];S.c=newCaseState();UI.tab=null;}else S.pendingEnd=true;
  const msg=v==='timeout'?'처리하지 못했어요.':v==='verify'?'확인 요청을 보냈어요.':v==='reject'?(report?'거부하고 신고했어요.':'거부하고 안내했어요.'):'승인했어요.';
  UI.sheet={type:'processed',v,msg}; save(); render();
}
function finishCase(){S.results.push({id:kase().id,ci:S.ci,log:S.c.stageLog,extraDocs:S.c.extraDocs});}
function nextCase(){
  UI.sheet=null;
  if(S.pendingEnd){S.pendingEnd=false;endDay('done');return;}
  S.view='desk';save();render();const sc=$('#screen');if(sc)sc.scrollTop=0;
}
function scoreStage(g,caseObj,extra){
  const st=caseObj.stages[g.si];
  let vp=g.outcome==='correct'?100:g.outcome==='alt'?Math.round(100*st.alt[g.verdict]):0;
  let rp=0,reqFound=0; g.risk.forEach(r=>{if(g.flags.includes(r.f)){rp+=r.req?20:10;if(r.req)reqFound++;}});
  rp=Math.max(0,rp-5*g.flags.filter(f=>!g.risk.some(r=>r.f===f)).length);
  const has=(a,b)=>g.clues.some(x=>(x.a===a&&x.b===b)||(x.a===b&&x.b===a));
  const kp=st.key.length&&st.key.every(grp=>grp.some(([a,b])=>has(a,b)))?20:0;
  let reasonPts=0; if(st.reasons&&g.outcome!=='wrong'&&g.verdict!=='approve'){const okSel=g.rs.filter(i=>st.reasons[i].ok).length,bad=g.rs.filter(i=>!st.reasons[i].ok).length,okAll=st.reasons.filter(r=>r.ok).length;reasonPts=bad?0:(okSel===okAll?30:okSel?15:0);}
  const routePts=g.outcome==='correct'&&g.routeOk?30:0;
  const reportPts=g.verdict==='reject'&&g.reportable!==undefined&&g.report===!!g.reportable?10:0;
  const timePts=g.outcome==='correct'&&g.left!=null?g.left:0; // versus only: faster correct answers score more
  return {vp,rp,kp,reasonPts,routePts,reportPts,timePts,reqFound,reqTotal:g.risk.filter(r=>r.req).length};
}
function endDay(reason){
  const logs=S.results.flatMap(r=>r.log.map(g=>({g,r})));
  let streak=0,total=0,timeBonus=0;
  logs.forEach(({g,r})=>{const sc=scoreStage(g,CASES[r.ci],r.extraDocs);if(g.outcome==='correct'){streak++;sc.streakPts=Math.min(40,10*(streak-1));}else{streak=0;sc.streakPts=0;}sc.total=sc.vp+sc.rp+sc.kp+sc.reasonPts+sc.routePts+sc.reportPts+sc.streakPts+sc.timePts;timeBonus+=sc.timePts;g.sc=sc;total+=sc.total;});
  const n=logs.length||1, ok=logs.filter(x=>x.g.outcome==='correct').length, handled=logs.filter(x=>x.g.outcome!=='wrong').length;
  const passRate=Math.round(handled/n*100);
  let failed=reason==='incident'; let why=failed?'incident':null;
  if(!failed&&passRate<PASS_RATE){failed=true;why='low';}
  if(!failed)S.cleared[S.diff]=true;
  let rank=null;
  if(versus()&&why!=='incident'){ // a security incident does not go on the board
    const now=new Date(), date=`${now.getMonth()+1}/${now.getDate()}`;
    const list=(S.ranks[S.diff]||[]).map(r=>Object.assign({},r,{last:false}));
    list.push({nick:S.nick,score:total,acc:Math.round(ok/n*100),date,last:true});
    list.sort((a,b)=>b.score-a.score); S.ranks[S.diff]=list.slice(0,10);
    rank=S.ranks[S.diff].findIndex(r=>r.last)+1||null;
  }
  S.end={reason:why||'pass',failed,total,acc:Math.round(ok/n*100),passRate,timeBonus,rank};
  S.view='end';UI.sheet=null;UI.mode=null;UI.open=failed&&why==='incident'?S.results.length-1:null;save();render();
  blip(failed?'alarm':'done');
  const sc=$('#screen');if(sc)sc.scrollTop=0;
}
function viewEnd(){
  const E=S.end, logs=S.results.flatMap(r=>r.log);
  const reqT=logs.reduce((a,g)=>a+g.sc.reqTotal,0), reqF=logs.reduce((a,g)=>a+g.sc.reqFound,0), det=reqT?Math.round(reqF/reqT*100):100;
  const over=logs.filter(g=>g.verdict==='reject'&&g.correct!=='reject').length;
  const riskApp=logs.filter(g=>g.verdict==='approve'&&g.correct!=='approve');
  const reps=logs.filter(g=>g.verdict==='reject'&&g.reportable!==undefined), repOK=reps.filter(g=>g.report===!!g.reportable).length;
  const w={low:10,medium:20,high:30};
  const safety=Math.max(0,100-riskApp.reduce((a,g)=>a+w[g.caseRisk||'medium'],0)), conv=Math.max(0,100-over*15);
  const stars=E.failed?0:1+(E.acc>=70?1:0)+(E.acc>=90&&det>=80&&!riskApp.some(g=>g.caseRisk==='high')?1:0);
  const bar=v=>Array.from({length:10},(_,i)=>`<i class="${i<Math.round(v/10)?'on':''}"></i>`).join('');
  const word=v=>v>=80?'튼튼해요':v>=50?'보통이에요':'조금 아쉬워요';
  const head=E.failed
    ?`<div class="seal fail">${E.reason==='incident'?'보안 사고':'점검 미달'}</div><h2 class="res-title">${E.reason==='incident'?'위험한 요청이 승인됐어요':'이번 근무는 다시 해 봐요'}</h2>
      <p class="res-sub">${E.reason==='incident'?'처음부터 다시':`처리 성공률 ${E.passRate}% · 통과 기준 ${PASS_RATE}%`}</p>`
    :`<div class="brief-day" style="text-align:center">${esc(D().name)} · ${MODES[S.mode].t} 완료</div><div class="stars" aria-label="별 ${stars}개">${[1,2,3].map(i=>px('star',34,i<=stars?'#F7D84A':'#7F9CC9')).join('')}</div>`;
  const rankCard=versus()?`<div class="rank-card pxb">${px('trophy',22)}<div><b>${E.total}점</b><span>${E.rank?`${esc(D().name)} 랭킹 ${E.rank}위 · 시간 보너스 +${E.timeBonus}`:'랭킹 미등록'}</span></div></div>`:'';
  const metrics=`<div class="card pxb"><div class="metrics">
      <span>판정 정확도</span><span>${E.acc}%</span><span>위험 탐지율</span><span>${det}% (${reqF}/${reqT})</span>
      <span>과잉 차단</span><span>${over}건</span><span>위험 승인</span><span>${riskApp.length}건</span>
      <span>신고 판단</span><span>${reps.length?`${repOK}/${reps.length}`:'—'}</span><span>점수</span><span>${E.total}점</span></div></div>
    <div class="card pxb"><div class="gauge"><div class="g-l"><span>안전 게이지</span><span>${word(safety)} ${safety}</span></div><div class="bar">${bar(safety)}</div></div>
      <div class="gauge conv" style="margin-top:10px"><div class="g-l"><span>편의 게이지</span><span>${word(conv)} ${conv}</span></div><div class="bar">${bar(conv)}</div></div></div>`;
  const review=S.results.map((r,idx)=>{
    const k=CASES[r.ci];
    return r.log.map((g,j)=>{
      const st=k.stages[g.si], good=g.outcome!=='wrong';
      const tag=g.outcome==='correct'?'<span class="mk ok">맞음</span>':g.outcome==='alt'?'<span class="mk bad">더 좋은 답 있음</span>':'<span class="mk flag">틀림</span>';
      const open=UI.open===idx;
      const risks=g.risk.length?g.risk.map(rk=>`<span class="chip ${g.flags.includes(rk.f)?'ok':'flag'}">${g.flags.includes(rk.f)?'찾음':'못 찾음'} · ${esc(rk.label)}</span>`).join(''):'<span class="chip">위험 요소 없음 · 정상 요청</span>';
      const reasons=st.reasons&&g.verdict!=='approve'?`<h4>올바른 근거</h4><div class="risk-list">${st.reasons.filter(x=>x.ok).map(x=>`<span class="chip ok">${px('check',10)} ${esc(x.t)}</span>`).join('')}</div>`:'';
      const route=g.verdict==='verify'&&st.routes?`<p><b>확인 경로:</b> ${g.routeOk?'공식 경로로 잘 확인했어요.':esc((st.routes.find((x,i)=>i===g.route)||{}).why||'원래 알던 공식 경로로 확인해야 해요.')}</p>`:'';
      const vres=st.verifyResult&&g.verdict==='verify'&&!st.next?`<div class="result-card pxb" style="white-space:pre-line">${px('phone',12)} 확인 결과\n${esc(st.verifyResult)}</div>`:'';
      const rep=g.verdict==='reject'&&g.reportable!==undefined?`<p><b>신고 판단:</b> ${g.report===!!g.reportable?'맞음':'틀림'}</p>`:'';
      const epi=good?st.epi.ok:st.epi.bad;
      const title=`${esc(k.title)}${k.stages.length>1?` · ${g.si+1}단계`:''}`;
      return `<div class="review pxb ${good?'':'bad'}"><button class="rv-head" data-act="rv" data-i="${idx}" aria-expanded="${open}"><span class="avatar">${face(k.who,28)}</span><span class="rv-t">${title}<small>내 판정 <b>${VERDICT[g.verdict].t}</b> · 정답 <b>${VERDICT[g.correct].t}</b></small></span>${tag}</button>
        ${open?`<div class="explain">${g.outcome==='alt'&&st.altNote?`<p><b>${esc(st.altNote)}</b></p>`:''}<h4>위험 요소</h4><div class="risk-list">${risks}</div>${reasons}${route}${vres}<h4>해설</h4><p>${esc(g.altPath&&st.explainAlt?st.explainAlt:st.explain)}</p>${rep}${epi?`<div class="epi" style="margin-top:10px"><span class="avatar">${face(st.epi.who,28)}</span><div class="say pxb">${esc(epi)}</div></div>`:''}<p class="small" style="color:var(--pencil);margin:8px 0 0">이번 사건 점수 ${g.sc.total}점</p></div>`:''}</div>`;
    }).join('');
  }).join('');
  const nextOpen=!E.failed&&S.diff<3;
  const buttons=versus()
    ?`<div class="row"><button class="btn yellow" data-act="again">다시 도전 ▶</button><button class="btn ghost" data-act="rank">${px('trophy',14)} 랭킹</button></div>`
    :E.failed?`<button class="btn yellow full" data-act="again">처음부터 다시 하기 ▶</button>`
    :`${nextOpen?`<button class="btn full" data-act="next-diff">다음 난이도: ${esc(DIFFS[S.diff+1].name)} ▶</button>`:''}<button class="btn ghost full" data-act="again">이 난이도 다시 하기</button>`;
  return `<div class="stack">${head}${rankCard}${metrics}
    <div><h4 class="rv-h">사건별 판정과 해설</h4><div class="stack" style="gap:10px">${review}</div></div>
    ${buttons}<button class="btn ghost full" data-act="exit">${px('home',14)} 처음 화면</button></div>`;
}
function startRun(d){S.diff=d;Object.assign(S,{view:'brief',run:DIFFS[d].cases.map(id=>CASES.findIndex(c=>c.id===id)),ri:0,results:[],c:null,end:null,pendingEnd:false});S.ci=S.run[0];save();render();}
function restart(){Object.assign(S,{view:'desk',ri:0,ci:S.run[0],results:[],end:null,pendingEnd:false});S.c=newCaseState();UI.tab=null;UI.open=null;save();render();}

/* ================= events ================= */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el)return;
  const a=el.dataset.act;
  if(a==='veil'){if(e.target===el&&UI.sheet&&['rules','lookup','settings','decide','pause'].includes(UI.sheet.type)){UI.sheet=null;render();}return;}
  if(el.disabled||el.getAttribute('aria-disabled')==='true'){if(a==='lookup')toast('조회할 자료 없음');if(a==='pick-diff')toast('잠김');return;}
  if(!['field','reason','route','report','tab'].includes(a))blip('tap');
  switch(a){
    case 'nick':S.nick=pickNick();save();render();break;
    case 'pick-mode':S.mode=el.dataset.m;S.view='diff';S.resumeView=null;S.c=null;save();render();break;
    case 'pick-diff':startRun(+el.dataset.d);break;
    case 'next-diff':startRun(S.diff+1);break;
    case 'rank':UI.rankTab=S.view==='end'?S.diff:UI.rankTab;S.view='rank';UI.sheet=null;save();render();break;
    case 'rank-tab':UI.rankTab=+el.dataset.d;render();break;
    case 'back':S.view='title';save();render();break;
    case 'resume':if(S.pendingEnd){S.view='desk';nextCase();}else{S.view=S.resumeView||'desk';render();}break;
    case 'begin':restart();break;
    case 'pause':UI.mode=null;UI.sheet={type:'pause'};render();break;
    case 'ask-exit':UI.sheet.confirmExit=true;render();break;
    case 'exit':S.resumeView=versus()?null:S.view;if(versus()){S.c=null;}S.view='title';UI.sheet=null;UI.mode=null;save();render();break;
    case 'sound':S.settings.sound=!S.settings.sound;save();render();if(S.settings.sound)blip('tap');break;
    case 'set-sound':S.settings.sound=el.dataset.x==='1';save();render();break;
    case 'mood':S.settings.mood=el.dataset.x;save();render();break;
    case 'settings':UI.sheet={type:'settings'};render();break;
    case 'rules':UI.sheet={type:'rules'};render();break;
    case 'lookup':UI.sheet={type:'lookup'};render();break;
    case 'close':UI.sheet=null;render();break;
    case 'tab':UI.tab=el.dataset.id;markSeen(UI.tab);save();render();break;
    case 'mode':{const m=el.dataset.m;UI.mode=UI.mode===m?null:m;UI.pick=null;render();break;}
    case 'field':tapField(el.dataset.id);break;
    case 'unclue':e.stopPropagation();S.c.clues.splice(+el.dataset.i,1);save();render();break;
    case 'reveal':{const id=el.dataset.id;S.c.revealed.push(id);UI.tab=id;markSeen(id);UI.sheet=null;save();render();toast('자료 추가');break;}
    case 'verdict':onVerdict(el.dataset.v);break;
    case 'reason':{const i=+el.dataset.i,rs=UI.sheet.rs,k=rs.indexOf(i);k>=0?rs.splice(k,1):rs.push(i);render();break;}
    case 'route':UI.sheet.route=+el.dataset.i;render();break;
    case 'report':UI.sheet.report=el.dataset.r==='1';render();break;
    case 'submit':{const s=UI.sheet;decide(s.v,s.rs,s.route,s.v==='reject'?s.report:null);break;}
    case 'next':nextCase();break;
    case 'rv':{const i=+el.dataset.i;UI.open=UI.open===i?null:i;render();break;}
    case 'again':restart();break;
    case 'scale':S.settings.scale=+el.dataset.x;save();render();break;
    case 'font':S.settings.plain=el.dataset.x==='1';save();render();break;
    case 'still':S.settings.still=!S.settings.still;save();render();break;
    case 'ask-reset':UI.sheet.confirmReset=true;render();break;
    case 'reset':S=defaults();try{localStorage.removeItem(KEY);}catch(err){}UI={tab:null,mode:null,pick:null,sheet:null,toast:null,open:null,rankTab:0};save();render();break;
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&UI.sheet&&['rules','lookup','settings','decide','pause'].includes(UI.sheet.type)){UI.sheet=null;render();}});

function start(data){
  if(data&&data.S)S=data.S; else load();
  if(['desk','brief'].includes(S.view)&&(!S.run||!S.run.length))S.view='title';
  if(S.view==='desk'&&!S.c)S.view='brief';
  if(S.view==='end'&&!S.end)S.view='title';
  if(S.view==='desk'&&versus()){S.view='title';S.c=null;S.resumeView=null;} // a versus run cannot be resumed after reload
  render();
}
if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)window.claude.hot.snapshot(()=>({S}));
(window.claude&&window.claude.hot&&window.claude.hot.ready)?window.claude.hot.ready(start):start(window.claude&&window.claude.hot&&window.claude.hot.data||{});

</script>

</body>
